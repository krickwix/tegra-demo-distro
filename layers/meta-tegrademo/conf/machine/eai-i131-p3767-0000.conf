#@TYPE: Machine
#@NAME: Lanner EAI-I131 (Orin NX 16GB)
#@DESCRIPTION: Lanner EAI-I131 carrier with NVIDIA Orin NX 16GB module (p3767-0000)

# Start from NVIDIA's p3509+p3767 baseline used by Lanner documentation,
# then apply carrier-specific BCT/pinmux overrides.
require conf/machine/p3509-a02-p3767-0000.conf

TEGRA_FLASHVAR_PINMUX_CONFIG ?= "tegra234-mb1-bct-pinmux-p3767-hdmi-a03.dtsi"
TEGRA_FLASHVAR_PMC_CONFIG ?= "tegra234-mb1-bct-padvoltage-p3767-hdmi-a03.dtsi"

# The p3509 baseline enables the HDMI DCB overlay for the Xavier NX devkit
# carrier. Keep the EAI carrier BCT/pinmux overrides, but avoid passing that
# DCB overlay through UEFI/DCE on R36 where it prevents early platform resource
# handoff.
TEGRA_PLUGIN_MANAGER_OVERLAYS = "tegra234-carveouts.dtbo tegra-optee.dtbo tegra234-p3768-0000+p3767-0000-dynamic.dtbo"
TEGRA_FLASHVAR_DCE_OVERLAY = ""

# Use carrier-adjusted MB2 BCT sources (overlaid via tegra-binaries bbappend)
TEGRA_FLASHVAR_MB2BCT_CFG ?= "tegra234-mb2-bct-misc-p3767-0000.dts"
TEGRA_FLASHVAR_SCR_CONFIG ?= "tegra234-mb2-bct-scr-p3767-0000.dts"
